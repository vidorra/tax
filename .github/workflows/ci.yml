name: CI & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrations on an empty SQLite file (as start.sh does)
        run: npm run db:migrate
        env:
          DATABASE_PATH: ${{ runner.temp }}/ibcalculator-ci.db
      - name: Parameter changelog check
        run: npx tsx scripts/tax-diff.ts --check
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid

  deploy:
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
    steps:
      - uses: actions/checkout@v4
        if: env.CAPROVER_SERVER != ''
      - name: Deploy to CapRover
        if: env.CAPROVER_SERVER != ''
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.APP_NAME }}
          token: ${{ secrets.APP_TOKEN }}
      - name: Skip deploy (no CapRover secrets configured)
        if: env.CAPROVER_SERVER == ''
        run: echo "CAPROVER_SERVER secret not set; skipping deploy."
